<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <script>
    // Apply the saved theme before the page paints, so there is no flash.
    try {
      var t = (JSON.parse(localStorage.getItem('hd.settings') || '{}').theme) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>HighDusting · Site Survey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js?v=5"></script>
  <script src="calc.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
